name: Linux build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      metamod: ${{ steps.release.outputs.metamod }}
      tag: ${{ steps.release.outputs.tag }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/github-script@v7
        id: release
        with:
          script: |
            const {data: releases} = await github.rest.repos.listReleases({
              owner: 'alliedmodders', repo: 'metamod-source', per_page: 100
            });
            const release = releases.find(r => !r.draft && r.prerelease && /^2\.0\./.test(r.tag_name));
            if (!release) throw new Error('No Metamod 2.0 prerelease found');
            const tag = context.ref.startsWith('refs/tags/')
              ? context.ref.slice(10)
              : `build-${context.sha.slice(0, 12)}-mm-${release.tag_name}`;
            core.setOutput('metamod', release.tag_name);
            core.setOutput('tag', tag);
            let build = true;
            if (context.eventName === 'schedule') {
              try {
                const {data: existing} = await github.rest.repos.getReleaseByTag({...context.repo, tag});
                // A draft or a release without an uploaded archive is not a successful build.
                build = existing.draft || !existing.assets.some(a => a.name.endsWith('-linux.tar.gz'));
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }
            core.setOutput('build', String(build));
            core.summary.addRaw(`Metamod: ${release.tag_name}; build: ${build}`).write();

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk
    env:
      CC: clang-16
      CXX: clang++-16
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: ${{ needs.resolve.outputs.metamod }}
          path: mmsource-2.0
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: cs2
          path: hl2sdk-cs2
      - uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk-manifests
          path: hl2sdk-manifests
      - uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          path: ambuild
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y clang-16
          cd ambuild
          python3 setup.py install
      - name: Test KHook lifecycle
        run: |
          clang++-16 -std=c++20 -I plugin -I mmsource-2.0/third_party/khook/include plugin/tests/khook_lifecycle.cpp -o /tmp/khook_lifecycle
          /tmp/khook_lifecycle
      - name: Build Linux x86_64
        working-directory: plugin
        run: |
          mkdir build
          cd build
          python3 ../configure.py --enable-optimize --symbol-files --targets x86_64 --sdks cs2 --hl2sdk-manifests "$GITHUB_WORKSPACE/hl2sdk-manifests"
          ambuild
          test -s package/addons/fakeranks/bin/linuxsteamrt64/fakeranks.so
          test -s package/addons/metamod/fakeranks.vdf
      - name: Record dependency revisions
        run: |
          for repo in plugin mmsource-2.0 hl2sdk-cs2 hl2sdk-manifests ambuild; do
            printf '%s ' "$repo"
            git -C "$repo" rev-parse HEAD
          done > build-info.txt
          cat build-info.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Linux
          path: plugin/build/package
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.txt

  release:
    needs: [resolve, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Linux
          path: Linux
      - uses: actions/download-artifact@v4
        with:
          name: build-info
      - name: Package
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: tar -czf "FakeRanks-RevealAll-${RELEASE_TAG}-linux.tar.gz" -C Linux addons
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          METAMOD: ${{ needs.resolve.outputs.metamod }}
        run: |
          printf 'Linux x86_64 build against Metamod %s.\n\nExtract the archive into game/csgo. Ranks must be assigned by another plugin.\n\nDependency revisions:\n' "$METAMOD" > notes.txt
          cat build-info.txt >> notes.txt
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file notes.txt --prerelease
          fi
          gh release upload "$RELEASE_TAG" "FakeRanks-RevealAll-${RELEASE_TAG}-linux.tar.gz" build-info.txt --clobber
